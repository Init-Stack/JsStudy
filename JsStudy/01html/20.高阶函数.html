<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>高阶函数</title>
</head>
<body>


<script>
    //高阶函数：形参或结果是函数，或形参结果都是函数
    //这样的函数叫高阶函数

    //高阶函数的作用
    //1 使用高阶函数创建的系列类似功能的函数
    function fn1(x){
        return x + 1;
    }

    function fn2(x){
        return x>5;
    }
    function fn3(x){
        return x>100;
    }

</script>
</body>
</html>
