<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>this关键字</title>
</head>
<body>


<script>

    //全局上下文this--》window
    console.log(this)


    //函数上下文
    //1 函数作为一个普通函数执行
    //函数里面的this指向window
    function fn1(){
        console.log(this)
    }
    console.log('函数作为普通函数执行this')
    fn1()//window

    //2 函数作为对象方法调用

    let obj1 ={
        menthod:fn1
    }
    console.log('函数作为对象方法执行')
    console.log(obj1);//obj1


    //3 函数最为构造函数执行
    function Person(name) {
        this.name=name;
        console.log(this.name);
    }




    //4 函数是使用call /apply 方法简介调用
    function fn2(){
        console.log(this)
    }
    console.log('函数是使用call/apply方法间接调用this：')
    //函数是使用call/apply方法间接调用,
    //this指向传给call，apply方法的第一个参数（一般是对象）

    fn2.call({x:1,y:1},'abc');//this->{x:1,y:1}
    fn2.apply({x:1,y:1},[]);//this->{x:1,y:1}


    //5 箭头函数中的this
    let obj5 ={
        menthod1:function (){
            console.log(this)
        },
        menthod2:()=>{
            console.log(this)
        }
    }
    console.log('箭头函数中的this')
    //箭头函数不创建自己的this，从箭头函数作用域上继承
    obj5.menthod1();//this-》obj5
    obj5.menthod2();//this->window



</script>


</body>
</html>
