<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>数组方法</title>
</head>
<body>

<script>
    let arr = [1, 2, 3, 4, 5];

    // 1. 增删：push / pop / shift / unshift
    arr.push(6);        // 末尾添加
    arr.pop();          // 末尾删除
    arr.unshift(0);     // 开头添加
    arr.shift();        // 开头删除
    console.log("增删后：", arr);

    // 2. slice：截取（不改变原数组）
    let part = arr.slice(1, 3);
    console.log("slice(1,3)：", part, "原数组：", arr);

    // 3. splice：删除/替换/插入（改变原数组）
    let arr2 = [1, 2, 3, 4, 5];
    arr2.splice(1, 2);          // 从索引1删除2个
    console.log("splice 删除后：", arr2);

    // splice 插入：从索引1删除0个，插入 9
    let arr3 = [1, 2, 3];
    arr3.splice(1, 0, 9);
    console.log("splice 插入后：", arr3);

    // splice 替换：从索引1删除1个，替换成 8
    let arr4 = [1, 2, 3];
    arr4.splice(1, 1, 8);
    console.log("splice 替换后：", arr4);

    // 4. 遍历：forEach / map / filter
    let nums = [1, 2, 3, 4, 5];
    nums.forEach((n, i) => console.log(`索引${i} = ${n}`));

    let doubled = nums.map(n => n * 2);
    console.log("map 翻倍：", doubled);

    let evens = nums.filter(n => n % 2 === 0);
    console.log("filter 偶数：", evens);

    // 5. 查找：indexOf / includes / find / findIndex / lastIndexOf
    console.log("indexOf(3)：", nums.indexOf(3));
    console.log("includes(10)：", nums.includes(10));
    console.log("find 第一个大于3的：", nums.find(n => n > 3));
    console.log("findIndex 第一个大于3的索引：", nums.findIndex(n => n > 3));
    console.log("lastIndexOf(3)：", [1, 3, 3, 5].lastIndexOf(3));

    // 6. 其他常用：join / concat / reverse / sort
    console.log("join：", nums.join("-"));
    console.log("concat：", nums.concat([6, 7]));
    console.log("reverse：", [...nums].reverse());
    console.log("sort：", [3, 1, 2].sort());

    // 7. reduce：累加，把数组归并成一个值
    let sum = nums.reduce((acc, cur) => acc + cur, 0);
    console.log("reduce 求和：", sum);

    let product = nums.reduce((acc, cur) => acc * cur, 1);
    console.log("reduce 求积：", product);

    // 8. some / every：判断数组是否满足条件
    let hasEven = nums.some(n => n % 2 === 0);
    console.log("some 是否有偶数：", hasEven);

    let allPositive = nums.every(n => n > 0);
    console.log("every 是否全为正数：", allPositive);

    // 9. flat / flatMap：拍平嵌套数组
    let nested = [1, [2, [3, 4]], 5];
    console.log("flat(1)：", nested.flat());
    console.log("flat(Infinity)：", nested.flat(Infinity));

    let flatMapped = [[1, 2], [3, 4]].flatMap(arr => arr);
    console.log("flatMap：", flatMapped);

    // 10. fill：用固定值填充
    let filled = new Array(3).fill(0);
    console.log("fill 创建：", filled);

    let arr5 = [1, 2, 3, 4, 5];
    arr5.fill(0, 1, 3);   // 从索引1到3填充0
    console.log("fill 部分填充：", arr5);

    // 11. Array.isArray：判断是否为数组
    console.log("Array.isArray([])：", Array.isArray([]));
    console.log("Array.isArray({})：", Array.isArray({}));

    // 12. at()：用索引取值，支持负数（从末尾算）
    let arr6 = [10, 20, 30, 40, 50];
    console.log("at(0)：", arr6.at(0));     // 10
    console.log("at(-1)：", arr6.at(-1));   // 50（最后一个）

    // 13. entries / keys / values：返回迭代器
    let arr7 = ["a", "b", "c"];
    for (let [index, value] of arr7.entries()) {
        console.log(`entries: ${index} -> ${value}`);
    }
    for (let key of arr7.keys()) {
        console.log("keys:", key);
    }

    // 14. sort 带比较函数（数字排序）
    let nums2 = [10, 2, 33, 5, 1];
    console.log("sort 升序：", [...nums2].sort((a, b) => a - b));
    console.log("sort 降序：", [...nums2].sort((a, b) => b - a));

    // 15. toString：数组转字符串
    console.log("toString：", [1, 2, 3].toString());

    // 16. copyWithin：内部复制（改变原数组）
    let arr8 = [1, 2, 3, 4, 5];
    arr8.copyWithin(0, 3);  // 把索引3开始的元素复制到索引0
    console.log("copyWithin 后：", arr8);

    // 17. 实战：数组去重
    let dup = [1, 2, 2, 3, 3, 3, 4];
    let unique = [...new Set(dup)];
    console.log("数组去重：", unique);

    // 18. 实战：数组最大值
    let max = Math.max(...nums);
    console.log("最大值：", max);

    // 19. 实战：合并数组的三种方式
    let a1 = [1, 2], a2 = [3, 4];
    console.log("concat 合并：", a1.concat(a2));
    console.log("展开符合并：", [...a1, ...a2]);
    console.log("push 合并：", [].concat(a1, a2));
</script>

</body>
</html>
