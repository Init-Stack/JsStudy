<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>数组方法</title>
</head>
<body>
<script>
  //forEach()方法
  let arr1 = [1,2,3,4,5]
  let sum =0
  function fnsum(a){
    return sum = sum+a
  }
  //forEach会把原数组的元素逐个传进调用函数，进行处理（求和）
  //当传进的函数(箭头函数),只有一个形参时（x），x就表示数组元素
  // arr1.forEach((a)=>{return sum = sum+a})
  arr1.forEach(a=>sum = sum+a) //arr1.forEach(fncum)
  console.log(sum)

  // 当传进的函数(箭头函数),有3个参数时
  //第一个参数x，就是数组元素
  //第二个参数index，是当前迭代元素的索引
  //第三个参数arr，是数组本身
  arr1.forEach((x,index,arr)=>{
    console.log(x+'-'+index,arr)
  })
  //forEach不能中断，只能连续输出


  //map()方法：使用传入的函数，对原数组元素进行逐个处理
  //得到的结果构成一个新的数组
  let arr2 = [1,2,3,4,5];

  let arr3 = arr2.map(x=>x*x)
  console.log(arr2)
  console.log(arr3)
  //对于稀疏数组，空位置map方法忽略不处理，得到的数组也是稀疏的、

  //filler()方法：使用过滤函数对数组元素进行处理
  //符合条件的元素构成新的数组
  //过滤必须是断言函数
  let arr4 = [1,2,3,4,5];
  let arr4_1 = arr4.filter(x => x%2==0)
  console.log(arr4)
  console.log(arr4_1)
  //filter方法会清除稀疏矩阵数组空的元素

  let arr4_2 = [1,,2,3,4,,5];
  let arr4_3 = arr4_2.filter(()=>true)
  console.log(arr4_2)
  console.log(arr4_3)
  //也可以使用filter处理数组中的null，undefined
  let arr4_4 = [1,2,null,3,,undefined,5];
  let arr4_5 = arr4_4.filter(x=> x!==null && x!==undefined)
  console.log(arr4_5)

  //reduce()方法：使用传入函数(归并函数)，对数组进行归并处理
  //返回一个结果值
  let arr5 = [1,2,3,4,5];

  //reduce只传入一个归并函数：（a，b）=> a+b ==>求和
  //归并函数：有两个参数a、b
  //第一次迭代：a取数组的第一个元素，b取元素的第二个元素
  ///第二次后的迭代：a为上一次归并运算的结果，b为数组的下一个元素
  let result1 = arr5.reduce((a,b)=> a+b)
  console.log(result1)
  let result2 = arr5.reduce((a,b)=>{
    console.log(`a=${a}-${b}`,a+b)
    return a+b
  })
  // console.log(result2)

  //reduce传入两个参数
  //reduce第一个参数：归并函数（a,b) => a+b
  //reduce第二个参数（可选）：初始值7
  //归并函数的参数a，b
  //第一次迭代：a为reduce的第二个参数（初始值），b为数组第一个元素
  //第二次迭代：a为上一次迭代结果 ，b为数组下一个元素
  // let result3 = arr5.reduce((a,b)=>a+b,7)
  let result3 = arr5.reduce((a,b)=>{
    console.log(`a=${a}-${b}`,a+b)
    return a+b
  },7)
  console.log(result3)

  //push()方法:往数组尾部推入一个元素
  let arr6 = ['a', 'b', 'c', 'd', 'e', 'f'];
  console.log(arr6)
  arr6.push('k')
  console.log(arr6)
  //pop方法：从尾部推出一个元素，并返回
  let result4 = arr6.pop()
  console.log(result4)
  console.log(arr6)
  //shift:从数组的头部移出一个元素，并返回
  let result5 =arr6.shift()
  console.log(result5)
  console.log(arr6)
  //unshift:从头部压入一个元素
  arr6.unshift('k')
  console.log(arr6)

  //slice:抽取子数组
  let arr7 = ['a', 'b', 'c', 'd', 'e', 'f'];
  console.log(arr7)
  let arr8 =arr7.slice(2,4)
  console.log(arr8)
  console.log(arr7)

  //splice:对数组模拟增删改删改查的操作
  let arr9 = ['a', 'b', 'c', 'd', 'e', 'f'];
  console.log(arr9)
  //第一个参数，指定要删除的索引
  //第二个参数，指定要删除多少个元素
  arr9.splice(2,1)
  console.log(arr9)
  //模拟添加
  let arr10 = ['a', 'b', 'c', 'd', 'e', 'f'];
  console.log(arr10)
  //第一个参数，指定要删除元素的素引
  //第二个参数，指定要删除多少个元素，不删除
  //第三个参数。要插入的元素
  arr10.splice(2,0,'k')
  console.log(arr10)
  let arr11 = ['a', 'b', 'c', 'd', 'e', 'f'];
  console.log(arr11)
  arr11.splice(2,1,'k')
  console.log(arr11)

  //解构数组：使用一组变量，把数组元素取出赋值
  let arr12 = ['a', 'b', 'c']
  let [first,second]=arr12
  console.log(first)
  console.log(second)















</script>

</body>
</html>
