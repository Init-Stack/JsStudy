<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

</head>
<body>
  <h1>hello world</h1>
  <div class="btn">
    <button onclick="btn()">点击我</button>
  </div>
  <div class="btn2">
    <button onclick="btn2()">别点击</button>
  </div>
</body>
</html>

<script>
/* 引入外部项目js */
import { btn, btn2 } from "/02js/test.js";
/* 引入vue */
import { createApp } from "vue";
const app = createApp({
  data(){
    return{
      msg:"hello vue"
    }
  },
  methods:{
    changeMsg(){
      this.msg = "hello vue 2";
    }
  }
});
app.mount("#app");

  console.log("Hello");
  const btn = ()=>{

  };
  const btn2 = ()=>{
    alert("说了别点击我，不听话");
    console.log("谁让你点了");
  };
</script>
