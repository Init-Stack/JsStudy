<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>类</title>
</head>
<body>
<script>
    //类定义
    class MyClass3{
        //构造函数
        constructor(){

        }
        //类方法
        method1(){

        }
        //getter/setter属性
        get length(){}
        set length(length){}

    }


    class Animal{
        //构造器
        constructor(){
            //在构造里定义的属性方法-->实例成员
            //使用this绑定实例成员
            this.name = name;
            this.whoIs = function (){
                console.log(this.name);
            }
            this.whereIs = ()=>{
                console.log('这是一个实例方法');
            }
        }
        //在类块定义的方法--》原型成员
        whereIs() {
            console.log('这是一个原型方法')
        }
        //原型属性--未支持
        //test = '123'

        //访问器属性
        set type(type){
            this._type = type;
        }
        get type(){
            return this._type;
        }
        //静态成员:static
        static eat(){
            console.log('正在吃动西')
        }
        //静态属性
        static color = '白色'
    }

    let animal1 = new Animal('小白兔')
    animal1.whereIs()
    animal1.whoIs()
    //访问原型方法
    Animal.prototype.whereIs()
    //console.log(Animal.prototype.test)
    //访问器使用
    animal1.type = '家畜'
    console.log(animal1.type)
    //静态方法
    Animal.eat()
    //静态属性
    console.log(Animal.color)

</script>

</body>
</html>
